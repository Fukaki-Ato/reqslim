name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite is self-contained: it boots real loopback HTTP servers and
      # needs no pytest or any third-party package.
      - run: python -I tests/test_zcode.py
      - run: python -I -m unittest discover -s tests -p "test_*regressions.py" -v
